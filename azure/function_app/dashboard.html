<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColdTrace</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #16181d; --muted: #5f6672; --line: #e2e5ea;
    --ok: #1f7a4d; --ok-bg: #e5f4ec; --bad: #b42318; --bad-bg: #fdecea; --warn: #9a6700;
    --accent: #2457c5; --limit: #b42318;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --ink: #e8eaee; --muted: #9aa3b2; --line: #2a2f3a;
      --ok: #4cc38a; --ok-bg: #12291e; --bad: #ff6b5e; --bad-bg: #331512; --warn: #e3b341;
      --accent: #7aa2ff; --limit: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .tile, .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .big { font-size: 30px; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .small { color: var(--muted); font-size: 13px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-weight: 650; font-size: 14px; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.bad { color: var(--bad); background: var(--bad-bg); }
  .pill.muted { color: var(--muted); background: var(--line); }
  .hot { color: var(--bad); }
  .panel { margin-top: 12px; }
  .panel h2 { font-size: 15px; margin: 0 0 10px; }
  svg { display: block; width: 100%; height: 220px; }
  .axis { stroke: var(--line); }
  .axis-text { fill: var(--muted); font-size: 11px; }
  .temp-line { fill: none; stroke: var(--accent); stroke-width: 2; }
  .limit-line { fill: none; stroke: var(--limit); stroke-width: 1.5; stroke-dasharray: 5 4; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .scroll { overflow-x: auto; }
  .err { color: var(--bad); }
  footer { color: var(--muted); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ColdTrace</h1>
    <span class="sub" id="who">loading…</span>
  </header>

  <section class="tiles">
    <div class="tile"><div class="label">Temperature</div><div class="big" id="temp">–</div><div class="small" id="limit">&nbsp;</div></div>
    <div class="tile"><div class="label">Status</div><div class="big"><span class="pill" id="status">–</span></div><div class="small" id="alertnote">&nbsp;</div></div>
    <div class="tile"><div class="label">Last seen</div><div class="big" id="seen">–</div><div class="small" id="online">&nbsp;</div></div>
    <div class="tile"><div class="label">Readings this boot</div><div class="big" id="recv">–</div><div class="small" id="gaps">&nbsp;</div></div>
    <div class="tile"><div class="label">Ingest latency, p50</div><div class="big" id="p50">–</div><div class="small" id="p95">&nbsp;</div></div>
  </section>

  <section class="panel">
    <h2>Temperature, last readings</h2>
    <svg id="chart" viewBox="0 0 1000 220" preserveAspectRatio="none" role="img" aria-label="Temperature chart"></svg>
  </section>

  <section class="panel">
    <h2>Alerts</h2>
    <div class="scroll"><table>
      <thead><tr><th>Status</th><th>Raised</th><th>Cleared</th><th>Temp</th><th>Limit</th><th>Window</th></tr></thead>
      <tbody id="alerts"><tr><td colspan="6" class="small">none</td></tr></tbody>
    </table></div>
  </section>

  <footer id="foot">Refreshes every 10 s. Latency uses cloud clocks only (IoT Hub enqueue → stored).</footer>
</main>
<script>
const params = new URLSearchParams(location.search);
const device = params.get("device") || "coldtrace-01";
const $ = id => document.getElementById(id);
const fmtT = v => (v === null || v === undefined) ? "–" : `${Number(v).toFixed(2)} °C`;
const time = iso => iso ? new Date(iso).toLocaleTimeString() : "–";
function ago(s) {
  if (s === null || s === undefined) return "never";
  if (s < 90) return `${Math.round(s)} s ago`;
  if (s < 5400) return `${Math.round(s / 60)} min ago`;
  return `${(s / 3600).toFixed(1)} h ago`;
}

function chart(series, limit) {
  const svg = $("chart"), W = 1000, H = 220, L = 44, R = 8, T = 10, B = 24;
  if (!series.length) { svg.innerHTML = `<text x="${L}" y="${H / 2}" class="axis-text">no readings yet</text>`; return; }
  const temps = series.map(p => p.temp);
  const lim = limit === null || limit === undefined ? [] : [limit];
  let lo = Math.min(...temps, ...lim), hi = Math.max(...temps, ...lim);
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = i => L + (series.length === 1 ? 0 : i * (W - L - R) / (series.length - 1));
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const path = vals => vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  let s = "";
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`;
    s += `<text class="axis-text" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(1)}</text>`;
  }
  if (lim.length) {
    s += `<line class="limit-line" x1="${L}" x2="${W - R}" y1="${y(limit)}" y2="${y(limit)}"/>`;
    s += `<text class="axis-text" x="${W - R}" y="${y(limit) - 5}" text-anchor="end">limit ${limit.toFixed(2)} °C</text>`;
  }
  s += `<path class="temp-line" d="${path(temps)}"/>`;
  s += `<text class="axis-text" x="${L}" y="${H - 6}">seq ${series[0].seq}</text>`;
  s += `<text class="axis-text" x="${W - R}" y="${H - 6}" text-anchor="end">seq ${series[series.length - 1].seq}</text>`;
  svg.innerHTML = s;
}

function render(d) {
  if (!d.known) { $("who").textContent = `${device}: no data yet`; return; }
  $("who").textContent = `${d.device} · boot ${d.boot} · updated ${time(d.now)}`;
  const hot = d.limit_c !== null && d.last_temp > d.limit_c;
  $("temp").textContent = fmtT(d.last_temp);
  $("temp").className = "big" + (hot ? " hot" : "");
  $("limit").textContent = d.limit_c === null ? "" : `limit ${fmtT(d.limit_c)}`;
  $("status").textContent = d.status;
  $("status").className = "pill " + (d.status === "OK" ? "ok" : "bad");
  $("alertnote").textContent = d.open_alert ? "excursion alert open" : "no open alert";
  $("seen").textContent = ago(d.seconds_since_seen);
  $("online").textContent = d.online ? "online" : "offline (no reading for 2 min)";
  const g = d.integrity;
  $("recv").textContent = `${g.received} / ${g.expected}`;
  $("gaps").textContent = (g.missing_count ? `${g.missing_count} missing: ${g.missing.join(", ")}` : "no gaps")
    + ` · ${g.duplicates_absorbed} duplicates absorbed`;
  const l = d.ingest_ms;
  $("p50").textContent = l.p50 === null ? "–" : `${Math.round(l.p50)} ms`;
  $("p95").textContent = l.p95 === null ? "" : `p95 ${Math.round(l.p95)} ms · ${l.n} readings`;
  chart(d.series, d.limit_c);
  $("alerts").innerHTML = d.alerts.length ? d.alerts.map(a => `<tr>
      <td><span class="pill ${a.status === "OPEN" ? "bad" : a.status === "CLEARED" ? "ok" : "muted"}">${a.status}</span></td>
      <td>${time(a.raised_at)}</td><td>${time(a.cleared_at)}</td>
      <td>${fmtT(a.temp)}</td><td>${fmtT(a.limit_c)}</td><td>${a.window_s} s</td></tr>`).join("")
    : `<tr><td colspan="6" class="small">none</td></tr>`;
}

async function refresh() {
  try {
    const r = await fetch(`status${location.search}`, { cache: "no-store" });
    if (!r.ok) throw new Error(`status ${r.status}`);
    render(await r.json());
    $("foot").className = "";
  } catch (e) {
    $("foot").textContent = `Could not load data (${e.message}). Retrying…`;
    $("foot").className = "err";
  }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>

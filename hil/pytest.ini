[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
junit_family = xunit1
markers =
    smoke: fast sanity checks (pytest -m smoke)
    functional: protocol behaviour
    fault: sensor fault injection
    hooks: needs the test-hook build (skipped automatically on a production build)
    robustness: malformed input and command floods
    reset: software and watchdog resets
    slow: takes more than a few seconds (pytest -m "not slow" skips them)
    perf: latency measurement
    wokwi_limit(reason): known Wokwi simulator limitation; expected to fail (xfail) on --target wokwi
    cloud: ColdTrace end-to-end test (esp32_cloud firmware + Azure); runs only with --cloud

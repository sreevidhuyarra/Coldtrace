; ESP32 temperature logger firmware.
;
;   pio run -e esp32        production build (no test hooks)
;   pio run -e esp32_test   adds FAULT commands; the one Wokwi runs
;
; The portable C core lives in core/ (also built on a PC by the top-level
; Makefile). src_dir is "." so PlatformIO compiles both src/ and core/.

[platformio]
src_dir = .
default_envs = esp32, esp32_test

[env]
; Pinned: espressif32 6.9.0 = Arduino-ESP32 2.0.17 (ESP-IDF 4.4).
; Changing it can switch the watchdog API (see main.cpp).
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<src/> +<core/> -<test/>
build_flags = -Icore
; warnings for our code only, not the Arduino framework
build_src_flags = -Wall -Wextra -Werror

[env:esp32]

[env:esp32_test]
build_flags = ${env.build_flags} -DLOGGER_TEST_HOOKS
